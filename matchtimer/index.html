<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1411">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Matchtimern">
<meta name="description" content="Dubbeltimer för matchtid och spelarbyten.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Matchtimern</title>
<style>
  /* ---- Designvärden: lugn, tydlig, hög kontrast (mobil + vikbart först) ---- */
  :root{
    --bg:#0b1411;
    --bg-grad:radial-gradient(120% 80% at 50% -10%, #11201a 0%, #0b1411 60%);
    --surface:#14201a;
    --surface-2:#1b2a22;
    --border:rgba(255,255,255,.07);
    --border-strong:rgba(255,255,255,.14);
    --text:#f1f5f3;
    --muted:#8aa093;
    --match:#34d399;     /* matchtid */
    --match-dim:rgba(52,211,153,.18);
    --sub:#fbbf24;       /* byten */
    --sub-dim:rgba(251,191,36,.18);
    --danger:#ef4444;
    --r:20px;
    --r-sm:14px;
    --tap:56px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    background-image:var(--bg-grad);
    color:var(--text);
    overflow:hidden;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;
  }
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:.5px}

  /* ---- Skärmar ---- */
  .screen{position:fixed;inset:0;display:none;flex-direction:column;
    padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
  .screen.active{display:flex}

  /* ---- Topbar ---- */
  .topbar{display:flex;align-items:center;gap:12px;padding:18px 22px 6px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--border);display:grid;place-items:center;flex-shrink:0}
  .brand-mark svg{width:20px;height:20px}
  .brand-title{font-size:19px;font-weight:700;letter-spacing:.2px;line-height:1}
  .brand-sub{font-size:11px;color:var(--muted);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px}

  /* ---- Setup ---- */
  .setup-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:12px 20px 16px;display:flex;flex-direction:column;gap:11px;align-content:start}
  .lead{color:var(--muted);font-size:14.5px;line-height:1.5;margin:2px 2px 6px}

  .stepper{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:16px 16px 18px;transition:border-color .2s}
  .stepper-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
  .stepper-label{font-size:16px;font-weight:600}
  .stepper-row{display:flex;align-items:center;gap:14px}
  .step-btn{flex-shrink:0;width:var(--tap);height:var(--tap);border-radius:16px;
    border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
    font-size:30px;font-weight:500;line-height:1;display:grid;place-items:center;cursor:pointer;
    transition:transform .08s ease, background .15s, opacity .15s}
  .step-btn:active{transform:scale(.92);background:#243a30}
  .step-btn:disabled{opacity:.32;cursor:not-allowed}
  .step-value{flex:1;text-align:center;min-width:0}
  .step-num{font-size:46px;font-weight:700;line-height:1}
  .step-unit{font-size:13px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1.4px}
  .stepper.accent-match{box-shadow:inset 0 0 0 1px var(--match-dim)}
  .stepper.accent-sub{box-shadow:inset 0 0 0 1px var(--sub-dim)}
  .accent-match .step-num{color:var(--match)}
  .accent-sub .step-num{color:var(--sub)}

  .summary{display:flex;justify-content:center;gap:8px;padding:6px 2px 2px}
  .sum-item{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 6px}
  .sum-val{font-size:clamp(15px,4.6vw,18px);font-weight:700;color:var(--text);
    white-space:nowrap;line-height:1}
  .sum-lbl{font-size:10.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;line-height:1}

  /* ---- Målvakter ---- */
  .gk-row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:13px 16px;color:var(--text);font:inherit;transition:transform .08s ease,background .15s}
  .gk-row:active{transform:scale(.99);background:var(--surface-2)}
  .gk-ico{font-size:22px;line-height:1;flex-shrink:0}
  .gk-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .gk-title{font-size:16px;font-weight:600;line-height:1}
  .gk-sub{font-size:12.5px;color:var(--muted);line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gk-chev{color:var(--muted);font-size:24px;line-height:1;flex-shrink:0}

  .back-btn{width:38px;height:38px;flex-shrink:0;border-radius:12px;cursor:pointer;
    background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    font-size:26px;line-height:1;display:grid;place-items:center;padding-bottom:3px}
  .back-btn:active{background:#243a30}

  .gk-add{display:flex;gap:9px}
  .gk-input{flex:1;min-width:0;height:52px;border-radius:14px;padding:0 15px;font:inherit;font-size:16px;
    background:var(--surface);border:1px solid var(--border-strong);color:var(--text);
    -webkit-user-select:text;user-select:text}
  .gk-input::placeholder{color:var(--muted)}
  .gk-input:focus{outline:none;border-color:var(--match)}
  .gk-add-btn{width:52px;flex-shrink:0;height:52px;border-radius:14px;border:none;cursor:pointer;
    background:var(--match);color:#062018;font-size:28px;font-weight:600;line-height:1;display:grid;place-items:center}
  .gk-add-btn:active{filter:brightness(.94)}

  .gk-list{display:flex;flex-wrap:wrap;gap:8px}
  .gk-list:empty{display:none}
  .gk-tag{display:flex;align-items:center;gap:9px;background:var(--surface);
    border:1px solid var(--border-strong);border-radius:999px;padding:8px 8px 8px 14px;font-size:15px}
  .gk-tag button{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
    background:rgba(255,255,255,.08);color:var(--muted);font-size:17px;line-height:1;display:grid;place-items:center}
  .gk-tag button:active{background:var(--danger);color:#fff}

  .gk-sched-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
  .gk-sched-title{font-size:13px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
  .gk-even{background:none;border:none;cursor:pointer;font:inherit;font-size:13px;
    color:var(--match);text-decoration:underline;padding:4px 0}
  .gk-schedule{display:flex;flex-direction:column;gap:8px}
  .gk-slot{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--border);border-radius:14px;padding:9px 12px 9px 15px}
  .gk-slot-lbl{font-size:14.5px;color:var(--muted);flex-shrink:0}
  .gk-select{flex:1;min-width:0;height:44px;border-radius:11px;padding:0 12px;font:inherit;font-size:15.5px;
    font-weight:600;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text);
    -webkit-appearance:none;appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;padding-right:34px}
  .gk-select:focus{outline:none;border-color:var(--match)}
  .gk-note{font-size:13px;line-height:1.45;color:var(--muted);padding:2px 2px 0}
  .gk-note.warn{color:var(--sub)}
  .gk-empty{font-size:13.5px;color:var(--muted);line-height:1.5;padding:2px}

  /* Målvakt på matchskärmen */
  .gk-chip{display:flex;align-items:center;gap:5px;min-width:0;
    margin-left:4px;padding-left:10px;border-left:1px solid var(--border-strong);
    font-size:14px;font-weight:700;overflow:hidden}
  .gk-chip[hidden]{display:none}
  .gk-chip-ico{font-size:13px;flex-shrink:0}
  .gk-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- Knappar ---- */
  /* .screen lägger redan på safe-area i botten – lägg inte på den två gånger */
  .footer{padding:12px 20px 14px;flex-shrink:0}
  .btn{width:100%;height:62px;border:none;border-radius:18px;font-size:18px;font-weight:700;
    letter-spacing:.3px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .08s ease, filter .15s, background .2s}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:var(--match);color:#062018}
  .btn-primary:active{filter:brightness(.94)}
  .btn-amber{background:var(--sub);color:#241a00}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,.4);height:54px;font-size:16px}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong)}
  .btn svg{width:22px;height:22px}

  /* ---- Timerskärm ---- */
  .timer-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px 4px}
  /* Ligger i flödet mellan pillret och prickarna – aldrig ovanpå dem */
  .paused-badge{display:none;align-items:center;gap:8px;white-space:nowrap;
    background:var(--surface-2);border:1px solid var(--border-strong);
    border-radius:999px;padding:6px 13px;font-size:11.5px;font-weight:700;letter-spacing:1.2px;
    text-transform:uppercase;color:var(--text)}
  .paused-badge .pulse{width:8px;height:8px;border-radius:50%;background:var(--text);
    animation:pausePulse 1.4s ease-in-out infinite}
  @keyframes pausePulse{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1.1)}}
  .is-paused .paused-badge{display:flex}
  .is-paused .tcard{opacity:.4;transition:opacity .3s}
  .is-paused .period-pill{opacity:.35}
  /* Prickarna är redundanta med "1 / 2"-pillret – ge plats åt märket i stället */
  .is-paused .dots{display:none}
  /* Dialogrutan äger skärmen – dölj pausmärket bakom den */
  .has-overlay .paused-badge{display:none}
  .period-pill{display:flex;align-items:center;gap:9px;min-width:0;background:var(--surface);
    border:1px solid var(--border);border-radius:999px;padding:8px 15px}
  .period-pill .lbl,.period-pill .val{flex-shrink:0}
  .period-pill .lbl{font-size:11px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}
  .period-pill .val{font-size:15px;font-weight:700}
  .dots{display:flex;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong)}
  .dot.done{background:var(--match);border-color:var(--match)}
  .dot.current{background:var(--match);border-color:var(--match);box-shadow:0 0 0 4px var(--match-dim)}

  .arena{flex:1;display:flex;flex-direction:column;gap:12px;padding:8px 18px;
    align-items:stretch;justify-content:center;min-height:0;overflow:hidden}

  .tcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    padding:12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;overflow:hidden;flex:1;min-height:0}
  .tcard-label{font-size:11.5px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:4px}
  .tcard.match .tcard-label{color:var(--match)}
  .tcard.sub .tcard-label{color:var(--sub)}

  .ring-wrap{position:relative;width:min(52vw,200px);aspect-ratio:1;max-height:24vh;flex-shrink:1}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:var(--surface-2);stroke-width:13}
  .ring-fg{fill:none;stroke-width:13;stroke-linecap:round;
    transition:stroke-dashoffset .25s linear}
  .match .ring-fg{stroke:var(--match)}
  .sub .ring-fg{stroke:var(--sub)}
  .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:2px}
  .big-time,.sub-time{font-size:clamp(44px,10vw,66px);font-weight:700;line-height:1}
  .small-time{font-size:14px;color:var(--muted)}
  .tcard.match.flash{animation:flashMatch .9s ease}
  .tcard.sub.flash{animation:flashSub .9s ease}
  @keyframes flashMatch{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--match) inset, 0 0 36px var(--match-dim)}}
  @keyframes flashSub{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 3px var(--sub) inset, 0 0 36px var(--sub-dim)}}

  /* Kontroller längst ned på timerskärmen */
  .controls{padding:6px 18px 16px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
  .controls-row{display:flex;gap:10px}
  .controls-row .btn{flex:1}
  .btn-sub{background:var(--surface-2);color:var(--sub);border:1px solid rgba(251,191,36,.45)}
  .btn-sub:active{background:#2a2410}

  /* Toast / banner */
  .toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(-140%);
    background:var(--surface-2);border:1px solid var(--border-strong);border-radius:14px;
    padding:13px 20px;font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:10px;
    z-index:50;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);max-width:90vw;text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.sub{border-color:var(--sub);color:var(--sub)}
  .toast.match{border-color:var(--match);color:var(--match)}
  .toast .ico{width:22px;height:22px;flex-shrink:0}

  /* Overlay vid paus/slut/paus mellan perioder */
  .overlay{position:absolute;inset:0;background:rgba(7,15,12,.82);backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;text-align:center;padding:30px;z-index:20}
  .overlay.show{display:flex}
  .overlay h2{font-size:30px;font-weight:800;letter-spacing:.3px}
  .overlay p{color:var(--muted);font-size:15.5px;max-width:300px;line-height:1.5;white-space:pre-line}
  .overlay .ov-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;margin-top:14px}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;transition-duration:.05s !important}
  }

  /* ---- Responsivt: bred/öppnad Fold 6 → timrar sida vid sida ---- */
  @media (min-width:620px) and (min-aspect-ratio:3/4){
    .arena{flex-direction:row;gap:20px;padding:14px 26px}
    .ring-wrap{width:min(34vw,300px);max-height:52vh}
    .setup-body{max-width:640px;margin:0 auto;width:100%}
    .footer{max-width:640px;margin:0 auto;width:100%}
  }
  @media (min-width:820px){
    .setup-body{display:grid;grid-template-columns:1fr 1fr;align-items:start}
    .lead,.summary,.setup-body .btn{grid-column:1 / -1}
  }
</style>
</head>
<body>

<!-- ============ SETUP ============ -->
<section id="setupScreen" class="screen active">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="8" stroke="#34d399" stroke-width="2"/><path d="M12 13V8.5" stroke="#f1f5f3" stroke-width="2" stroke-linecap="round"/><rect x="10" y="2.5" width="4" height="2.4" rx="1" fill="#34d399"/></svg>
      </div>
      <div>
        <div class="brand-title">Matchtimern</div>
        <div class="brand-sub">Period &amp; byten</div>
      </div>
    </div>
  </div>

  <div class="setup-body">

    <div class="stepper accent-match" id="st-periods">
      <div class="stepper-head">
        <span class="stepper-label">Antal perioder</span>
      </div>
      <div class="stepper-row">
        <button class="step-btn" data-act="dec" aria-label="Färre perioder">−</button>
        <div class="step-value"><div class="step-num tnum" id="v-periods">2</div><div class="step-unit">perioder</div></div>
        <button class="step-btn" data-act="inc" aria-label="Fler perioder">+</button>
      </div>
    </div>

    <div class="stepper accent-match" id="st-minutes">
      <div class="stepper-head">
        <span class="stepper-label">Minuter per period</span>
      </div>
      <div class="stepper-row">
        <button class="step-btn" data-act="dec" aria-label="Kortare period">−</button>
        <div class="step-value"><div class="step-num tnum" id="v-minutes">12</div><div class="step-unit">minuter</div></div>
        <button class="step-btn" data-act="inc" aria-label="Längre period">+</button>
      </div>
    </div>

    <div class="stepper accent-sub" id="st-sub">
      <div class="stepper-head">
        <span class="stepper-label">Byt spelare var</span>
      </div>
      <div class="stepper-row">
        <button class="step-btn" data-act="dec" aria-label="Tätare byten">−</button>
        <div class="step-value"><div class="step-num tnum" id="v-sub">5</div><div class="step-unit">minut</div></div>
        <button class="step-btn" data-act="inc" aria-label="Glesare byten">+</button>
      </div>
    </div>

    <button class="gk-row" id="openKeepers">
      <span class="gk-ico">🧤</span>
      <span class="gk-text">
        <span class="gk-title">Målvakter</span>
        <span class="gk-sub" id="gkSummary">Ingen vald</span>
      </span>
      <span class="gk-chev" aria-hidden="true">›</span>
    </button>

    <div class="summary" id="summary"></div>
  </div>

  <div class="footer">
    <button class="btn btn-primary" id="startMatchBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="M13 6l6 6-6 6"/></svg>
      Till matchen
    </button>
  </div>
</section>

<!-- ============ MÅLVAKTER ============ -->
<section id="keepersScreen" class="screen">
  <div class="topbar">
    <button class="back-btn" id="keepersBack" aria-label="Tillbaka">‹</button>
    <div>
      <div class="brand-title">Målvakter</div>
      <div class="brand-sub">En per period</div>
    </div>
  </div>

  <div class="setup-body">
    <div class="gk-add">
      <input id="gkName" class="gk-input" type="text" placeholder="Lägg till namn"
             maxlength="18" autocomplete="off" autocapitalize="words" enterkeyhint="done">
      <button class="gk-add-btn" id="gkAdd" aria-label="Lägg till målvakt">+</button>
    </div>

    <div id="gkList" class="gk-list"></div>

    <div class="gk-sched-head">
      <span class="gk-sched-title">Vem står i mål?</span>
      <button class="gk-even" id="gkEven">Fördela jämnt</button>
    </div>
    <div id="gkSchedule" class="gk-schedule"></div>
    <div id="gkNote" class="gk-note"></div>
  </div>

  <div class="footer">
    <button class="btn btn-primary" id="keepersDone">Klar</button>
  </div>
</section>

<!-- ============ TIMER ============ -->
<section id="timerScreen" class="screen">
  <div class="timer-top">
    <div class="period-pill">
      <span class="lbl">Period</span>
      <span class="val tnum" id="periodVal">1 / 2</span>
      <span class="gk-chip" id="gkChip" hidden><span class="gk-chip-ico">🧤</span><span id="gkChipName"></span></span>
    </div>
    <div class="dots" id="dots"></div>
    <div class="paused-badge" id="pausedBadge"><span class="pulse"></span><span id="pausedText">Pausad</span></div>
  </div>

  <div class="arena">
    <!-- Matchtid -->
    <div class="tcard match" id="matchCard">
      <div class="tcard-label">Matchtid</div>
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="86"/>
          <circle class="ring-fg" id="matchRing" cx="100" cy="100" r="86"/>
        </svg>
        <div class="ring-center">
          <div class="big-time tnum" id="matchTime">12:00</div>
          <div class="small-time tnum" id="matchRemain">spelat 00:00</div>
        </div>
      </div>
    </div>

    <!-- Byten -->
    <div class="tcard sub" id="subCard">
      <div class="tcard-label">Nästa byte</div>
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="86"/>
          <circle class="ring-fg" id="subRing" cx="100" cy="100" r="86"/>
        </svg>
        <div class="ring-center">
          <div class="sub-time tnum" id="subTime">05:00</div>
          <div class="small-time tnum" id="subCount">Byte 1</div>
        </div>
      </div>
    </div>

    <!-- Overlay (paus / paus mellan perioder / slut) -->
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Pausad</h2>
      <p id="ovText"></p>
      <div class="ov-actions">
        <button class="btn btn-primary" id="ovPrimary">Fortsätt</button>
        <button class="btn btn-ghost" id="ovSecondary">Avsluta</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="playPauseBtn">
      <svg viewBox="0 0 24 24" fill="currentColor" id="ppIcon"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      <span id="ppLabel">Pausa</span>
    </button>
    <div class="controls-row">
      <button class="btn btn-sub" id="subNowBtn" aria-label="Gör byte nu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M8 21H3v-5"/><path d="M3 21l7-7"/></svg>
        Byt nu
      </button>
      <button class="btn btn-ghost" id="nextPeriodBtn" aria-label="Gå till nästa period">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/></svg>
        Nästa period
      </button>
    </div>
    <button class="btn btn-danger" id="exitBtn">Avsluta match</button>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="assertive"><span class="ico" id="toastIco"></span><span id="toastMsg"></span></div>

<script>
(() => {
  'use strict';

  // ---------- Hjälpare ----------
  const $ = (id) => document.getElementById(id);
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const fmt = (sec) => {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  };
  // Nedräkning: avrunda uppåt så full tid visas hela första sekunden
  // och 00:00 nås exakt när tiden är slut.
  const fmtDown = (sec) => fmt(Math.ceil(Math.max(0, sec) - 1e-6));
  // Förfluten tid: avrunda nedåt (00:00 tills första sekunden passerat).
  const fmtUp = (sec) => fmt(Math.floor(Math.max(0, sec)));
  const RING_C = 2 * Math.PI * 86;
  [$('matchRing'), $('subRing')].forEach(r => { r.style.strokeDasharray = RING_C; });
  const setRing = (el, frac) => { el.style.strokeDashoffset = RING_C * (1 - clamp(frac, 0, 1)); };

  // ---------- Inställningar ----------
  const LIMITS = { periods: [1, 12], minutes: [1, 60], sub: [1, 30] };
  const DEFAULTS = { periods: 2, minutes: 12, sub: 5, keepers: [], gk: [] };
  const MAX_KEEPERS = 12;
  let cfg = loadCfg();

  function loadCfg() {
    try {
      const s = JSON.parse(localStorage.getItem('matchtimern.cfg'));
      if (s && s.periods) return {
        periods: clamp(s.periods, ...LIMITS.periods),
        minutes: clamp(s.minutes, ...LIMITS.minutes),
        sub: clamp(s.sub, ...LIMITS.sub),
        keepers: Array.isArray(s.keepers) ? s.keepers.filter(n => typeof n === 'string').slice(0, 12) : [],
        gk: Array.isArray(s.gk) ? s.gk.slice(0, 12) : [],
      };
    } catch (e) {}
    return { ...DEFAULTS, keepers: [], gk: [] };
  }
  function saveCfg() { try { localStorage.setItem('matchtimern.cfg', JSON.stringify(cfg)); } catch (e) {} }

  // ---------- Målvakter ----------
  // Rotationen ger en målvakt per period i tur och ordning, så ingen står
  // fler perioder än någon annan (så länge det finns minst lika många
  // målvakter som perioder). Manuella val behålls så länge de är giltiga.
  // cfg.gk innehåller BARA manuella val (null = låt appen välja). Schemat
  // räknas fram vid behov, så automatiken alltid fyller luckorna med den
  // som stått minst – även när listan ändras eller ett manuellt val görs.
  function gkPlan() {
    const R = cfg.keepers, P = cfg.periods;
    if (!R.length) return [];
    const manual = (cfg.gk || []).slice(0, P).map(n => (n && R.includes(n)) ? n : null);
    const out = new Array(P).fill(null);
    const count = new Map(R.map(n => [n, 0]));
    manual.forEach((n, i) => { if (n) { out[i] = n; count.set(n, count.get(n) + 1); } });
    for (let i = 0; i < P; i++) {
      if (out[i]) continue;
      let best = R[0];
      for (const n of R) if (count.get(n) < count.get(best)) best = n;
      out[i] = best; count.set(best, count.get(best) + 1);
    }
    return out;
  }
  // Rensa manuella val -> ren rotation
  function assignEven() { cfg.gk = []; }

  // Text som beskriver hur jämnt det blev
  function balanceNote(plan) {
    const R = cfg.keepers;
    if (!R.length) return ['', false];
    const counts = new Map(R.map(n => [n, 0]));
    plan.forEach(n => counts.set(n, (counts.get(n) || 0) + 1));
    const used = [...counts.values()];
    const max = Math.max(...used), min = Math.min(...used);
    if (R.length < cfg.periods) {
      const extra = [...counts].filter(([, c]) => c === max).map(([n]) => n);
      return [`${R.length} målvakter på ${cfg.periods} perioder – ${extra.join(', ')} står ${max} perioder.`, true];
    }
    if (max > 1) {
      const twice = [...counts].filter(([, c]) => c > 1).map(([n]) => n);
      const idle = [...counts].filter(([, c]) => c === 0).map(([n]) => n);
      return [`${twice.join(', ')} står ${max} perioder${idle.length ? `, medan ${idle.join(', ')} inte står alls` : ''}.`, true];
    }
    if (min === 0 && R.length > cfg.periods) {
      const idle = [...counts].filter(([, c]) => c === 0).map(([n]) => n);
      return [`Alla står högst en period. ${idle.join(', ')} står inte den här matchen.`, false];
    }
    return ['Alla står precis en period var.', false];
  }

  function renderKeepers() {
    const R = cfg.keepers;
    const plan = gkPlan();

    // Namnlistan
    const list = $('gkList');
    list.innerHTML = R.map((n, i) =>
      `<span class="gk-tag">${esc(n)}<button data-i="${i}" aria-label="Ta bort ${esc(n)}">×</button></span>`
    ).join('');
    list.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      cfg.keepers.splice(+b.dataset.i, 1);
      // Släpp val som pekar på en borttagen målvakt
      cfg.gk = (cfg.gk || []).map(n => cfg.keepers.includes(n) ? n : null);
      saveCfg(); renderKeepers(); renderSetup(); haptic(8);
    }));

    // Schemat: en rulle per period
    const sched = $('gkSchedule');
    if (!R.length) {
      sched.innerHTML = '<div class="gk-empty">Lägg till namnen på era målvakter, så fördelas de automatiskt med en per period.</div>';
      $('gkNote').textContent = '';
      $('gkNote').className = 'gk-note';
      return;
    }
    sched.innerHTML = Array.from({ length: cfg.periods }, (_, i) =>
      `<label class="gk-slot"><span class="gk-slot-lbl">Period ${i + 1}</span>` +
      `<select class="gk-select" data-i="${i}">` +
      R.map(n => `<option value="${esc(n)}"${n === plan[i] ? ' selected' : ''}>${esc(n)}</option>`).join('') +
      `</select></label>`
    ).join('');
    sched.querySelectorAll('select').forEach(s => s.addEventListener('change', () => {
      cfg.gk = cfg.gk || [];
      cfg.gk[+s.dataset.i] = s.value;   // manuellt val, resten fylls om automatiskt
      saveCfg(); renderKeepers(); renderSetup(); haptic(8);
    }));

    const [note, warn] = balanceNote(plan);
    $('gkNote').textContent = note;
    $('gkNote').className = 'gk-note' + (warn ? ' warn' : '');
  }

  const esc = (s) => String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function addKeeper() {
    const inp = $('gkName');
    const name = inp.value.trim().replace(/\s+/g, ' ');
    if (!name) return;
    if (cfg.keepers.length >= MAX_KEEPERS) { toast(`Max ${MAX_KEEPERS} målvakter`, 'sub', ICO_SUB); return; }
    if (cfg.keepers.some(n => n.toLowerCase() === name.toLowerCase())) {
      toast(`${name} finns redan`, 'sub', ICO_SUB); inp.select(); return;
    }
    cfg.keepers.push(name);
    inp.value = '';
    saveCfg(); renderKeepers(); renderSetup(); haptic(10);
  }

  $('gkAdd').addEventListener('click', addKeeper);
  $('gkName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addKeeper(); } });
  $('gkEven').addEventListener('click', () => { assignEven(); saveCfg(); renderKeepers(); renderSetup(); haptic(10); });
  $('openKeepers').addEventListener('click', () => { renderKeepers(); show('keepersScreen'); });
  $('keepersBack').addEventListener('click', () => show('setupScreen'));
  $('keepersDone').addEventListener('click', () => show('setupScreen'));

  function renderSetup() {
    $('v-periods').textContent = cfg.periods;
    $('v-minutes').textContent = cfg.minutes;
    $('v-sub').textContent = cfg.sub;
    $('st-sub').querySelector('.step-unit').textContent = cfg.sub === 1 ? 'minut' : 'minuter';
    const totalMin = cfg.periods * cfg.minutes;
    $('summary').innerHTML =
      `<div class="sum-item"><span class="sum-val">${totalMin} min</span><span class="sum-lbl">Totalt</span></div>` +
      `<div class="sum-item"><span class="sum-val">${cfg.periods} × ${cfg.minutes} min</span><span class="sum-lbl">Perioder</span></div>` +
      `<div class="sum-item"><span class="sum-val">var ${cfg.sub} min</span><span class="sum-lbl">Byten</span></div>`;
    // Målvaktsraden
    const gkNames = gkPlan();
    $('gkSummary').textContent = !cfg.keepers.length
      ? 'Ingen vald – tryck för att lägga till'
      : gkNames.map((n, i) => `${i + 1}. ${n}`).join(' · ');

    // Inaktivera knappar vid gräns
    bindLimit('st-periods', cfg.periods, LIMITS.periods);
    bindLimit('st-minutes', cfg.minutes, LIMITS.minutes);
    bindLimit('st-sub', cfg.sub, LIMITS.sub);
  }
  function bindLimit(id, val, [lo, hi]) {
    const el = $(id);
    el.querySelector('[data-act=dec]').disabled = val <= lo;
    el.querySelector('[data-act=inc]').disabled = val >= hi;
  }

  // Steppers med håll-in-för-upprepning
  const stepMap = { 'st-periods': 'periods', 'st-minutes': 'minutes', 'st-sub': 'sub' };
  Object.keys(stepMap).forEach(id => {
    $(id).querySelectorAll('.step-btn').forEach(btn => {
      let timer = null, delay = 480, count = 0;
      const key = stepMap[id], dir = btn.dataset.act === 'inc' ? 1 : -1;
      const apply = () => {
        cfg[key] = clamp(cfg[key] + dir, ...LIMITS[key]);
        saveCfg(); renderSetup(); haptic(8);
      };
      const start = (e) => {
        e.preventDefault();
        if (btn.disabled) return;
        apply(); count = 0;
        const loop = () => {
          if (btn.disabled) { stop(); return; }
          apply(); count++;
          timer = setTimeout(loop, Math.max(70, delay - count * 60));
        };
        timer = setTimeout(loop, delay);
      };
      const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointerleave', stop);
      btn.addEventListener('pointercancel', stop);
    });
  });

  // ---------- Matchtillstånd ----------
  // status: 'idle' | 'running' | 'paused' | 'break' | 'finished'
  const M = {
    status: 'idle',
    periodLen: 0, subLen: 0, periods: 1,
    period: 1,            // aktuell period (1-baserad)
    periodElapsed: 0,     // sekunder i aktuell period
    subElapsed: 0,        // sekunder i pågående bytescykel (egen parallell klocka)
    subCount: 0,          // antal genomförda byten denna period
    gk: [],               // målvakt per period (fryst vid matchstart)
    lastTick: 0,
  };

  let interval = null, wakeLock = null, audioCtx = null;

  // ---------- Ljud & haptik ----------
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, start, dur, vol = 0.22) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function haptic(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
  // Byteslarm: kort, ljus dubbelsignal + vibration
  function chimeSub() {
    ensureAudio();
    beep(880, 0, .18, .26); beep(1175, .22, .26, .28);
    haptic([0, 120, 70, 120]);
  }
  // Periodslutslarm: kraftigare, längre signal + lång vibration
  function chimePeriod() {
    ensureAudio();
    beep(784, 0, .22, .30); beep(784, .26, .22, .30);
    beep(784, .52, .22, .30); beep(1175, .80, .50, .32);
    haptic([0, 250, 120, 250, 120, 250, 120, 500]);
  }

  // ---------- Wake lock (skärmen tänd) ----------
  async function acquireWake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    // Ljudkontexten suspenderas när skärmen släcks – väck den, annars blir larmen tysta
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    if (M.status === 'running') acquireWake();
  });

  // ---------- Toast ----------
  let toastTimer = null;
  function toast(msg, kind, icon) {
    const t = $('toast');
    t.className = 'toast ' + (kind || '');
    $('toastMsg').textContent = msg;
    $('toastIco').innerHTML = icon || '';
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }
  const ICO_SUB = '<svg viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M21 3l-7 7"/><path d="M8 21H3v-5"/><path d="M3 21l7-7"/></svg>';
  const ICO_FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V4M5 4h11l-2 4 2 4H5"/></svg>';

  // ---------- Skärmbyten ----------
  function show(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(screen).classList.add('active');
  }

  // ---------- Starta match ----------
  function startMatch() {
    ensureAudio();
    M.periodLen = cfg.minutes * 60;
    M.subLen = cfg.sub * 60;
    M.periods = cfg.periods;
    M.period = 1;
    M.periodElapsed = 0;
    M.subElapsed = 0;
    M.subCount = 0;
    M.gk = gkPlan();   // frys schemat för den här matchen
    buildDots();
    show('timerScreen');
    setStatus('ready');   // öppna matchen utan att starta klockan
    render();
  }

  function buildDots() {
    const d = $('dots'); d.innerHTML = '';
    // Fler än 8 perioder får inte plats som prickar – "3 / 12"-pillret räcker då.
    if (M.periods > 8) return;
    const max = M.periods;
    for (let i = 0; i < max; i++) {
      const el = document.createElement('div');
      el.className = 'dot';
      d.appendChild(el);
    }
  }
  function paintDots() {
    const dots = $('dots').children, max = dots.length;
    for (let i = 0; i < max; i++) {
      dots[i].className = 'dot' +
        (i + 1 < M.period ? ' done' : i + 1 === M.period ? ' current' : '');
    }
  }

  // ---------- Status ----------
  function setStatus(s) {
    M.status = s;
    // Både "pausad" och "ej startad" dämpar klockorna och visar ett märke
    const waiting = (s === 'paused' || s === 'ready');
    $('timerScreen').classList.toggle('is-paused', waiting);
    if (waiting) $('pausedText').textContent = (s === 'ready') ? 'Ej startad' : 'Pausad';
    if (s === 'running') {
      M.lastTick = Date.now();
      if (!interval) interval = setInterval(tick, 200);
      acquireWake();
      hideOverlay();
      $('ppLabel').textContent = 'Pausa';
      $('ppIcon').innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
    } else {
      if (interval) { clearInterval(interval); interval = null; }
      releaseWake();
      $('ppLabel').textContent = (s === 'paused') ? 'Fortsätt' : 'Starta';
      $('ppIcon').innerHTML = '<path d="M7 5v14l12-7z"/>';
    }
  }

  // ---------- Tick ----------
  function tick() {
    const now = Date.now();
    let dt = (now - M.lastTick) / 1000;
    M.lastTick = now;
    if (M.status !== 'running') return;
    if (dt < 0) dt = 0;
    if (dt > 3600) dt = 3600;

    M.periodElapsed += dt;
    M.subElapsed += dt;

    let periodEnded = false;
    if (M.periodElapsed >= M.periodLen) { M.periodElapsed = M.periodLen; periodEnded = true; }

    // Bytesklockan är en egen parallell klocka: fyr när cykeln nått sin längd.
    if (!periodEnded && M.subElapsed >= M.subLen) {
      while (M.subElapsed >= M.subLen) { M.subElapsed -= M.subLen; M.subCount++; }
      onSubFire(); // ett larm även om flera cykler hoppats över (t.ex. efter bakgrund)
    }
    if (periodEnded) onPeriodEnd();

    render();
  }

  function onSubFire() {
    chimeSub();
    flash('subCard');
    toast('Dags att byta spelare!', 'sub', ICO_SUB);
  }

  function onPeriodEnd() {
    chimePeriod();
    flash('matchCard');
    if (M.period < M.periods) {
      setStatus('break');
      showBreakOverlay();
    } else {
      setStatus('finished');
      showFinishedOverlay();
    }
  }

  function showBreakOverlay() {
    const next = M.gk[M.period];   // målvakt för nästa period
    showOverlay(
      `Period ${M.period} slut`,
      `Paus före period ${M.period + 1} av ${M.periods}.` +
      (next ? `\n🧤 ${next} går i mål.` : ''),
      `Starta period ${M.period + 1}`, () => nextPeriod(),
      'Avsluta match', confirmExit
    );
  }

  function showFinishedOverlay() {
    showOverlay(
      'Matchen är slut',
      `${M.periods} perioder × ${M.periodLen / 60} min spelade.`,
      'Ny match', backToSetup,
      'Tillbaka', backToSetup
    );
  }

  function nextPeriod() {
    M.period++;
    M.periodElapsed = 0;
    M.subElapsed = 0;
    M.subCount = 0;
    setStatus('running');
    render();
    const keeper = M.gk[M.period - 1];
    toast(`Period ${M.period} igång` + (keeper ? ` · 🧤 ${keeper}` : ''), 'match', ICO_FLAG);
  }

  function flash(cardId) {
    const c = $(cardId);
    c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
  }

  // ---------- Rendering ----------
  function render() {
    paintDots();
    $('periodVal').textContent = `${M.period} / ${M.periods}`;

    const keeper = M.gk[M.period - 1];
    $('gkChip').hidden = !keeper;
    if (keeper) $('gkChipName').textContent = keeper;

    // Matchtid (räknar ner mot noll, precis som bytesklockan)
    const mElapsed = M.periodElapsed, mRemain = Math.max(0, M.periodLen - mElapsed);
    $('matchTime').textContent = fmtDown(mRemain);
    $('matchRemain').textContent = 'spelat ' + fmtUp(mElapsed);
    setRing($('matchRing'), mRemain / M.periodLen);

    // Bytesklocka (egen parallell klocka, räknar ner till nästa byte)
    const subRemain = (mRemain <= 0) ? 0 : Math.max(0, M.subLen - M.subElapsed);
    $('subTime').textContent = fmtDown(subRemain);
    $('subCount').textContent = 'Byte ' + (M.subCount + 1);
    setRing($('subRing'), subRemain / M.subLen);
  }

  // ---------- Overlay ----------
  let ovPrimaryFn = null, ovSecondaryFn = null;
  function showOverlay(title, text, primaryLabel, primaryFn, secondaryLabel, secondaryFn) {
    $('ovTitle').textContent = title;
    $('ovText').textContent = text;
    $('ovPrimary').textContent = primaryLabel;
    $('ovSecondary').textContent = secondaryLabel;
    ovPrimaryFn = primaryFn; ovSecondaryFn = secondaryFn;
    $('overlay').classList.add('show');
    $('timerScreen').classList.add('has-overlay');
  }
  function hideOverlay() {
    $('overlay').classList.remove('show');
    $('timerScreen').classList.remove('has-overlay');
  }
  $('ovPrimary').addEventListener('click', () => { ensureAudio(); ovPrimaryFn && ovPrimaryFn(); });
  $('ovSecondary').addEventListener('click', () => { ovSecondaryFn && ovSecondaryFn(); });

  // ---------- Kontroller ----------
  $('playPauseBtn').addEventListener('click', () => {
    ensureAudio();
    if (M.status === 'running') {
      setStatus('paused');                         // lugn pausindikator, ingen ruta
    } else if (M.status === 'paused' || M.status === 'ready') {
      setStatus('running');                        // starta klockan manuellt
    } else if (M.status === 'break') {
      nextPeriod();
    }
  });

  // Manuell periodkontroll: avsluta nuvarande period och starta nästa när domaren gör det
  $('nextPeriodBtn').addEventListener('click', () => {
    if (M.status !== 'running' && M.status !== 'paused') return;
    setStatus('paused');
    if (M.period < M.periods) {
      showOverlay(
        `Avsluta period ${M.period}?`,
        'Klockan pausas. Starta nästa period när domaren blåser igång.',
        `Starta period ${M.period + 1}`, () => nextPeriod(),
        `Fortsätt period ${M.period}`, () => setStatus('running')
      );
    } else {
      showOverlay(
        'Avsluta matchen?',
        'Detta är sista perioden.',
        'Avsluta match', () => { setStatus('idle'); hideOverlay(); show('setupScreen'); },
        `Fortsätt period ${M.period}`, () => setStatus('running')
      );
    }
  });

  $('subNowBtn').addEventListener('click', () => {
    if (M.status !== 'running' && M.status !== 'paused') return;
    // Byte gjort nu: räkna upp bytet och starta om bytesklockan (matchtiden orörd)
    M.subCount++;
    M.subElapsed = 0;
    render(); haptic(12);
    toast('Byte gjort – ny bytesklocka', 'sub', ICO_SUB);
  });

  function backToSetup() { setStatus('idle'); hideOverlay(); show('setupScreen'); }

  // Bekräftelse i appens egen dialog (inte webbläsarens confirm), och
  // "Tillbaka" återställer exakt det läge man kom ifrån.
  function confirmExit() {
    const prev = M.status;
    if (prev === 'running') setStatus('paused');
    showOverlay(
      'Avsluta matchen?',
      'Matchen avbryts och du kommer tillbaka till inställningarna.',
      'Avsluta match', backToSetup,
      'Tillbaka', () => {
        if (prev === 'running') setStatus('running');
        else if (prev === 'break') showBreakOverlay();
        else if (prev === 'finished') showFinishedOverlay();
        else hideOverlay();
      }
    );
  }
  $('exitBtn').addEventListener('click', confirmExit);
  $('startMatchBtn').addEventListener('click', startMatch);

  // ---------- Init ----------
  renderSetup();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();
</script>
</body>
</html>
